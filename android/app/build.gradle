import org.gradle.api.DefaultTask
import org.gradle.api.file.ConfigurableFileCollection
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.tasks.InputFiles
import org.gradle.api.tasks.OutputDirectory
import org.gradle.api.tasks.TaskAction

plugins {
    id 'com.android.application'
}

/*
 * ALPHA GRAVITY — app module.
 *
 * The game is NOT duplicated here: `syncWebApp` copies index.html (plus icon.svg and
 * manifest.webmanifest) from the repository root into the APK's assets at build time,
 * so the browser build and the Android build can never drift apart.
 *
 * Release signing is optional. CI decodes the KEYSTORE_BASE64 secret into a file and
 * passes -PalphaStoreFile / -PalphaStorePassword / -PalphaKeyAlias / -PalphaKeyPassword.
 * Without those the release APK is signed with the debug key, so `assembleRelease`
 * always produces something installable.
 */

def storeFilePath = project.findProperty('alphaStoreFile') ?: System.getenv('ALPHA_STORE_FILE')
def hasReleaseKey = storeFilePath != null && file(storeFilePath).exists()
def appVersionName = (project.findProperty('alphaVersionName') ?: '1.0.0').toString()
def appVersionCode = (project.findProperty('alphaVersionCode') ?: '1').toString().toInteger()

android {
    namespace 'com.alphacore.alphagravity'
    compileSdk 34

    defaultConfig {
        applicationId 'com.alphacore.alphagravity'
        minSdk 26          // Android 8.0 — required for adaptive launcher icons and modern WebView
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(storeFilePath)
                storePassword (project.findProperty('alphaStorePassword') ?: System.getenv('ALPHA_STORE_PASSWORD'))
                keyAlias (project.findProperty('alphaKeyAlias') ?: System.getenv('ALPHA_KEY_ALIAS') ?: 'alphagravity')
                keyPassword (project.findProperty('alphaKeyPassword') ?: System.getenv('ALPHA_KEY_PASSWORD'))
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles rootProject.file('../proguard-rules.pro')
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

/**
 * Copies the repository's web build into the APK assets.
 *
 * It is registered below as a *generated asset source*, which is what makes Gradle add
 * the dependency for every task that reads assets — asset merging, resource packaging
 * and the lint model writer alike. Winging it with a hand-rolled `dependsOn` triggers
 * "uses this output without declaring an explicit dependency" validation failures.
 */
abstract class SyncWebAppTask extends DefaultTask {
    /** The exact web files to package — listed individually so this task never depends on
     *  the whole repository directory (which contains this module's build output). */
    @InputFiles
    abstract ConfigurableFileCollection getWebFiles()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void run() {
        File out = getOutputDir().get().asFile
        getProject().delete(out)
        out.mkdirs()
        getProject().copy {
            from(getWebFiles())
            into out
        }
    }
}

def webRoot = rootProject.projectDir.parentFile

def syncWebApp = tasks.register('syncWebApp', SyncWebAppTask) {
    description = 'Copies the web build (index.html, icon.svg, manifest.webmanifest) into Android assets.'
    group = 'build'
    webFiles.setFrom(
            new File(webRoot, 'index.html'),
            new File(webRoot, 'icon.svg'),
            new File(webRoot, 'manifest.webmanifest'))
    outputDir.set(layout.buildDirectory.dir('generated/webassets'))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(syncWebApp, { it.outputDir })
    }
}
